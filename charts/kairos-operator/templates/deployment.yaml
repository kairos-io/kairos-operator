apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairos-operator.fullname" . }}
  namespace: {{ include "kairos-operator.namespace" . }}
  labels:
    {{- include "kairos-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kairos-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "kairos-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kairos-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "kairos-operator.operatorImage" . }}
        imagePullPolicy: {{ .Values.image.operator.pullPolicy }}
        command: [/manager]
        args:
          {{- if .Values.leaderElect }}
          - --leader-elect
          {{- end }}
          - --health-probe-bind-address=:8081
          {{- if .Values.toolImage }}
          - --tool-image={{ .Values.toolImage }}
          {{- end }}
          {{- if .Values.buildahImage }}
          - --buildah-image={{ .Values.buildahImage }}
          {{- end }}
        env:
        - name: CONTROLLER_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTROLLER_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPERATOR_IMAGE
          value: {{ include "kairos-operator.operatorImage" . }}
        - name: NODE_LABELER_IMAGE
          value: {{ include "kairos-operator.nodeLabellerImage" . }}
        - name: SENTINEL_IMAGE
          value: {{ .Values.sentinelImage | quote }}
        - name: NODEOP_DEFAULT_IMAGE
          value: {{ .Values.nodeops.defaultImage | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      terminationGracePeriodSeconds: 10
