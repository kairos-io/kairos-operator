{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kairos-operator.fullname" . }}-metrics-service
  namespace: {{ include "kairos-operator.namespace" . }}
  labels:
    {{- include "kairos-operator.labels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: {{ .Values.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.metrics.port }}
  selector:
    {{- include "kairos-operator.selectorLabels" . | nindent 4 }}
{{- end }}
