name: Helm Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Lint chart
        run: helm lint charts/kairos-operator

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION="$(sed -n 's/^KUSTOMIZE_VERSION ?= //p' Makefile)"
          TARBALL="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          curl -sSfL "${BASE}/${TARBALL}" -o "/tmp/${TARBALL}"
          curl -sSfL "${BASE}/checksums.txt" -o /tmp/kustomize-checksums.txt
          (cd /tmp && grep -F -- "${TARBALL}" kustomize-checksums.txt | sha256sum -c)
          tar -xz -C /usr/local/bin < "/tmp/${TARBALL}"

      - name: Build Kustomize install manifest
        run: |
          sed -i "\|newName: quay.io/kairos/operator$|{n;s|newTag: .*|newTag: ${{ inputs.version }}|}" config/manager/kustomization.yaml
          sed -i "s|value: quay.io/kairos/operator-node-labeler:v[^[:space:]]*|value: quay.io/kairos/operator-node-labeler:${{ inputs.version }}|g" config/default/kustomization.yaml
          mkdir -p dist
          kustomize build config/default > dist/install.yaml

      - name: Login to GHCR (OCI)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: |
          SEMVER="${{ inputs.version }}"
          SEMVER="${SEMVER#v}"
          helm package charts/kairos-operator \
            --version "${SEMVER}" \
            --app-version "${{ inputs.version }}" \
            --destination .chart-output

      - name: Create GitHub Release and upload artifacts
        run: |
          gh release view "${{ inputs.version }}" > /dev/null 2>&1 || \
            gh release create "${{ inputs.version }}" \
              --title "${{ inputs.version }}" \
              --generate-notes \
              --verify-tag
          gh release upload "${{ inputs.version }}" dist/install.yaml .chart-output/kairos-operator-*.tgz --clobber

      - name: Push chart to GHCR (OCI)
        run: |
          helm push .chart-output/kairos-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts
