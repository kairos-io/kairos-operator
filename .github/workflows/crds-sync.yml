name: CRDs sync

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  crds-sync:
    concurrency:
      group: crds-sync-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    name: CRDs sync
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify chart CRDs match generated CRDs
        run: |
          make update-crds
          git diff --exit-code -- config/crd/bases config/rbac charts/kairos-operator/crds api/v1alpha1

      - name: Verify chart ClusterRole covers generated RBAC rules
        run: |
          helm template kairos-operator charts/kairos-operator \
            --show-only templates/clusterrole.yaml > "$RUNNER_TEMP/chart-clusterrole.yaml"
          go run ./hack/chart-rbac-check config/rbac/role.yaml "$RUNNER_TEMP/chart-clusterrole.yaml"
