name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

env:
  REGISTRY: quay.io
  OPERATOR_IMAGE_NAME: kairos/operator
  NODE_LABELER_IMAGE_NAME: kairos/operator-node-labeler

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

  build-operator:
    needs: setup
    strategy:
      matrix:
        # The operator image installs kubectl, and upstream Kubernetes does not
        # publish a linux/riscv64 client (KUBE_SUPPORTED_CLIENT_PLATFORMS in
        # hack/lib/golang.sh), so this image stays on the two platforms it can
        # actually be built for. The operator runs on the control plane, not on
        # every node, so a RISC-V worker does not need it.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

  build-node-labeler:
    needs: setup
    strategy:
      matrix:
        # The node-labeler runs on every node, so every node architecture the
        # cluster can have needs an image. There is no GitHub-hosted riscv64
        # runner, so that leg cross-compiles on amd64: the builder stage in
        # Dockerfile.node-labeler is pinned to BUILDPLATFORM and only the
        # distroless runtime layer is riscv64.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: riscv64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push node-labeler image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.node-labeler
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NODE_LABELER_IMAGE_NAME }}:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NODE_LABELER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NODE_LABELER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

  combine-manifests:
    needs: [build-operator, build-node-labeler]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # ARCHES has to name every arch the matching build matrix above produced.
      # push-manifest.sh reads back the index it pushed and fails if the two
      # disagree, so an arch added to a matrix and forgotten here is a red
      # release job rather than an index that silently omits a platform.
      - name: Create and push operator manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:${{ inputs.version }}
          ARCHES: amd64 arm64
        run: ./hack/push-manifest.sh

      - name: Create and push node-labeler manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NODE_LABELER_IMAGE_NAME }}:${{ inputs.version }}
          ARCHES: amd64 arm64 riscv64
        run: ./hack/push-manifest.sh

  update-kustomization:
    needs: combine-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Create version bump branch
        run: |
          git checkout -b "chore/bump-version-${{ inputs.version }}"

      - name: Update version in kustomization files
        run: |
          # Update operator image version
          sed -i "s|value: quay.io/kairos/operator:v[^[:space:]]*|value: quay.io/kairos/operator:${{ inputs.version }}|g" config/default/kustomization.yaml
          # Update node-labeler image version
          sed -i "s|value: quay.io/kairos/operator-node-labeler:v[^[:space:]]*|value: quay.io/kairos/operator-node-labeler:${{ inputs.version }}|g" config/default/kustomization.yaml

      - name: Update Helm chart version
        run: |
          SEMVER="${{ inputs.version }}"
          SEMVER="${SEMVER#v}"
          sed -i "s/^version: .*/version: ${SEMVER}/" charts/kairos-operator/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ inputs.version }}\"/" charts/kairos-operator/Chart.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          git add config/default/kustomization.yaml charts/kairos-operator/Chart.yaml
          git commit -s -m "chore: bump version to ${{ inputs.version }}"
          git push origin "chore/bump-version-${{ inputs.version }}"

      - name: Create Pull Request
        run: |
          gh pr create \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "This PR updates the operator and node-labeler image versions to ${{ inputs.version }}" \
            --base main \
            --head "chore/bump-version-${{ inputs.version }}" \
            --label "version bump"