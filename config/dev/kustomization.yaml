apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kairos-operator
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: NODE_LABELER_IMAGE
              value: controller-node-labeler:latest
  target:
    kind: Deployment
    name: kairos-operator

images:
- name: quay.io/kairos/operator
  newName: controller
  newTag: latest
