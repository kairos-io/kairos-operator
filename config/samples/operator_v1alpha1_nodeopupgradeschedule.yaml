apiVersion: operator.kairos.io/v1alpha1
kind: NodeOpUpgradeSchedule
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: nodeopupgradeschedule-sample
spec:
  schedule: "0 3 * * *"
  timeZone: "UTC"
  suspend: false
  imagePolicy:
    repository: example.com/kairos
    semver: ">=3.6.2 <3.7.0"
    # imagePullSecrets:
    #   - name: registry-credentials
  upgradeTemplate:
    image: example.com/kairos:v3.6.2
